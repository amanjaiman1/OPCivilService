<!doctype html>
<html lang="en" data-surface="lavender">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f6fc" />
    <title>Offline · DoOrDie</title>
    <link rel="icon" href="/icons/icon-192.png?v=2" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2" />
    <!--
      The service worker's navigation fallback.

      Deliberately a standalone document: no app JavaScript, no build chunks,
      no auth or sleep gate. It has to render when nothing else can, so the
      design tokens below are a hand-copy of the app's three themes (Light,
      Dark and Lavender in src/app/globals.css). Lavender is the default.
    -->
    <style>
      :root,
      [data-surface="white"] {
        --ink: 214 238 251;
        --paper: 22 49 71;
        --accent: 14 107 196;
        --accent-fg: 255 255 255;
        --shadow: 32 88 132;
        --pane: rgb(255 255 255 / 0.62);
        --pane-edge: rgb(255 255 255 / 0.85);
        --quiet: 0.72;
        --backdrop:
          radial-gradient(64% 54% at 22% -12%, rgb(255 255 255 / 0.95), transparent 68%),
          radial-gradient(38% 62% at -6% 58%, rgb(100 188 235 / 0.62), transparent 72%),
          radial-gradient(44% 44% at 104% 6%, rgb(186 226 250 / 0.9), transparent 70%),
          radial-gradient(56% 50% at 94% 106%, rgb(122 196 240 / 0.46), transparent 72%),
          linear-gradient(165deg, rgb(226 243 253) 0%, rgb(211 236 251) 55%, rgb(198 230 249) 100%);
        color-scheme: light;
      }
      [data-surface="black"] {
        --ink: 0 0 0;
        --paper: 237 237 237;
        --accent: 245 245 245;
        --accent-fg: 10 10 10;
        --shadow: 0 0 0;
        --pane: rgb(20 20 22);
        --pane-edge: rgb(255 255 255 / 0.09);
        --quiet: 0.62;
        --backdrop: none;
        color-scheme: dark;
      }
      [data-surface="lavender"] {
        --ink: 247 246 252;
        --paper: 24 24 40;
        --accent: 108 92 231;
        --accent-fg: 255 255 255;
        --shadow: 76 60 160;
        --pane: rgb(255 255 255 / 0.92);
        --pane-edge: rgb(234 231 244);
        --quiet: 0.68;
        --backdrop:
          radial-gradient(42% 46% at 50% 16%, rgb(186 160 255 / 0.42), transparent 70%),
          radial-gradient(34% 40% at 22% 30%, rgb(255 196 168 / 0.45), transparent 70%),
          radial-gradient(40% 44% at 6% 94%, rgb(120 226 212 / 0.32), transparent 70%),
          linear-gradient(180deg, rgb(252 251 255) 0%, rgb(247 246 252) 60%, rgb(243 241 250) 100%);
        color-scheme: light;
      }
      [data-surface="aurora-jade"] {
        --ink: 232 241 234;
        --paper: 38 76 61;
        --accent: 61 170 150;
        --accent-fg: 16 46 38;
        --shadow: 63 119 95;
        --pane: rgb(248 252 249 / 0.92);
        --pane-edge: rgb(187 220 199);
        --quiet: 0.8;
        --backdrop: radial-gradient(58% 57% at 17% -9%, rgb(248 252 249 / 0.94), transparent 72%),
          radial-gradient(54% 64% at -9% 66%, rgb(187 220 199 / 0.82), transparent 76%),
          radial-gradient(55% 62% at 103% 4%, rgb(100 154 128 / 0.68), transparent 76%),
          linear-gradient(145deg, #E8F1EA 10%, #F8FCF9 49%, #C2E0CF 100%);
        color-scheme: light;
      }
      [data-surface="royal-porcelain"] {
        --ink: 250 234 208;
        --paper: 56 37 27;
        --accent: 208 128 39;
        --accent-fg: 40 22 7;
        --shadow: 147 100 56;
        --pane: rgb(251 244 228 / 0.92);
        --pane-edge: rgb(232 213 181);
        --quiet: 0.8;
        --backdrop: radial-gradient(58% 57% at 17% -9%, rgb(251 244 228 / 0.94), transparent 72%),
          radial-gradient(54% 64% at -9% 66%, rgb(233 174 134 / 0.82), transparent 76%),
          radial-gradient(55% 62% at 103% 4%, rgb(244 213 159 / 0.68), transparent 76%),
          linear-gradient(145deg, #FAEAD0 10%, #FBF4E4 49%, #E8D5B5 100%);
        color-scheme: light;
      }
      [data-surface="dreamscape"] {
        --ink: 247 201 250;
        --paper: 48 34 64;
        --accent: 149 92 249;
        --accent-fg: 23 10 45;
        --shadow: 140 87 189;
        --pane: rgb(252 237 253 / 0.92);
        --pane-edge: rgb(232 196 240);
        --quiet: 0.8;
        --backdrop: radial-gradient(58% 57% at 17% -9%, rgb(247 213 250 / 0.94), transparent 72%),
          radial-gradient(54% 64% at -9% 66%, rgb(226 141 235 / 0.82), transparent 76%),
          radial-gradient(55% 62% at 103% 4%, rgb(200 139 255 / 0.68), transparent 76%),
          linear-gradient(145deg, #F7C9FA 10%, #F7D5FA 49%, #D2CDF5 100%);
        color-scheme: light;
      }
      [data-surface="emerald-liquid-glass"] {
        --ink: 3 34 17;
        --paper: 240 248 241;
        --accent: 139 218 157;
        --accent-fg: 3 34 17;
        --shadow: 2 25 13;
        --pane: rgb(3 34 17 / 0.68);
        --pane-edge: rgb(235 255 237 / 0.24);
        --quiet: 0.86;
        --backdrop:
          radial-gradient(80% 105% at 12% 5%, rgb(99 179 107 / 0.8), transparent 71%),
          radial-gradient(62% 79% at 20% 41%, rgb(130 167 124 / 0.68), transparent 72%),
          radial-gradient(66% 82% at 100% 104%, rgb(3 34 17), transparent 89%),
          linear-gradient(154deg, #449252 0%, #155e2b 45%, #08441f 73%, #032211 100%);
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background-color: rgb(var(--ink));
        background-image: var(--backdrop);
        background-attachment: fixed;
        color: rgb(var(--paper));
        /* The app's Poppins is served by the bundler, which this standalone
           document can't reference — so it asks for Poppins (used if the OS has
           it) and otherwise falls back to the closest system face. */
        font-family:
          Poppins, ui-rounded, "SF Pro Rounded", "Segoe UI Variable",
          ui-sans-serif, system-ui, -apple-system, Roboto, Arial, sans-serif;
        letter-spacing: -0.011em;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: 100%;
        max-width: 27rem;
        padding: 2rem;
        border: 1px solid var(--pane-edge);
        border-radius: 1.75rem;
        background: var(--pane);
        box-shadow:
          inset 0 1px 0 rgb(255 255 255 / 0.5),
          0 24px 56px -28px rgb(var(--shadow) / 0.45);
        text-align: center;
      }
      [data-surface="black"] .card {
        box-shadow:
          inset 0 1px 0 rgb(255 255 255 / 0.08),
          0 24px 56px -28px rgb(0 0 0 / 0.7);
      }
      .mark {
        display: grid;
        place-items: center;
        width: 3.25rem;
        height: 3.25rem;
        margin: 0 auto;
        border-radius: 1rem;
        border: 1px solid var(--pane-edge);
        background: var(--pane);
      }
      h1 {
        margin: 1.35rem 0 0;
        font-size: 1.45rem;
        font-weight: 700;
        letter-spacing: -0.035em;
        line-height: 1.15;
      }
      p {
        margin: 0.7rem 0 0;
        font-size: 0.9rem;
        line-height: 1.65;
        color: rgb(var(--paper) / var(--quiet));
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
        margin-top: 1.6rem;
      }
      button,
      a.btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        width: 100%;
        padding: 0.8rem 1rem;
        border-radius: 999px;
        font: inherit;
        font-size: 0.9rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        cursor: pointer;
        text-decoration: none;
        transition:
          filter 0.2s ease,
          transform 0.2s ease,
          border-color 0.2s ease,
          color 0.2s ease;
      }
      button {
        border: 0;
        background: rgb(var(--accent));
        color: rgb(var(--accent-fg));
        box-shadow: 0 10px 26px -12px rgb(var(--accent) / 0.6);
      }
      [data-surface="black"] button {
        box-shadow: 0 10px 26px -14px rgb(var(--accent) / 0.12);
      }
      button:hover {
        filter: brightness(1.08);
        transform: translateY(-1px);
      }
      a.btn {
        border: 1px solid rgb(var(--paper) / 0.16);
        background: transparent;
        color: rgb(var(--paper) / 0.8);
      }
      a.btn:hover {
        border-color: rgb(var(--paper) / 0.32);
        color: rgb(var(--paper));
        transform: translateY(-1px);
      }
      .note {
        margin-top: 1.4rem;
        font-size: 0.75rem;
      }
      :focus-visible {
        outline: 2px solid rgb(var(--accent) / 0.6);
        outline-offset: 2px;
      }
      svg {
        display: block;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <!-- The DoOrDie mark: the cycle of days, with today lit up. -->
      <span class="mark">
        <svg viewBox="0 0 32 32" width="30" height="30" fill="none" aria-hidden="true">
          <circle cx="16" cy="16" r="12.5" stroke="rgb(var(--paper) / 0.3)" stroke-width="1.6" />
          <circle cx="16" cy="16" r="7" stroke="rgb(var(--paper) / 0.15)" stroke-width="1.6" />
          <line x1="16" y1="3.5" x2="16" y2="9" stroke="rgb(var(--accent) / 0.55)" stroke-width="1.6" stroke-linecap="round" />
          <circle cx="16" cy="3.5" r="2.4" fill="rgb(var(--accent))" />
        </svg>
      </span>

      <h1>This page isn’t available offline</h1>
      <p>
        Your chronicle lives on this device, so pages you’ve already opened still
        work without a connection. This one needs the network once — after that
        it’s cached too.
      </p>

      <div class="actions">
        <button type="button" onclick="location.reload()">Try again</button>
        <a class="btn" href="/dashboard">Back to the dashboard</a>
        <a class="btn" href="/journal">Open the journal</a>
      </div>

      <p class="note">Anything you log offline is saved locally and syncs later.</p>
    </main>

    <script>
      // Match the theme the signed-in account chose (appearance is saved per
      // account, under keys ending in its id), and retry automatically the
      // moment the connection returns. Values older versions saved still
      // paint the theme they now mean, as in app/layout.tsx.
      try {
        var session = JSON.parse(localStorage.getItem("upsc-chronicle-auth") || "null");
        var id = session && session.user && session.user.id ? session.user.id : "local";
        var mode = localStorage.getItem("upsc-chronicle-theme:" + id) || "";
        if (!mode) {
          var old = localStorage.getItem("upsc-chronicle-surface:" + id) || "";
          mode = old ? (old === "white" ? "light" : "dark") : "lavender";
        }
        if (mode === "system") {
          mode = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        if (mode === "blue") mode = "light";
        var meta = document.querySelector('meta[name="theme-color"]');
        if (mode === "dark") {
          document.documentElement.setAttribute("data-surface", "black");
          meta.setAttribute("content", "#000000");
        } else if (mode === "light") {
          document.documentElement.setAttribute("data-surface", "white");
          meta.setAttribute("content", "#d6eefb");
        } else {
          var extra = {"aurora-jade":"#e8f1ea","royal-porcelain":"#faead0","dreamscape":"#f7c9fa","emerald-liquid-glass":"#032211"};
          if (Object.prototype.hasOwnProperty.call(extra, mode)) {
            document.documentElement.setAttribute("data-surface", mode);
            meta.setAttribute("content", extra[mode]);
          }
        }
      } catch (e) {}
      window.addEventListener("online", function () {
        location.reload();
      });
    </script>
  </body>
</html>
